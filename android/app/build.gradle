plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// Play upload key. android/key.properties and the keystore stay out of git;
// without them a release build is signed with the debug key (local tests only).
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "com.yakup.helperly"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.yakup.helperly"
        minSdk = 24
        // Google Play requires API 36 for new apps and updates since 2026-08-31.
        targetSdk = 36
        // From pubspec.yaml / --build-number, so each Play upload gets a new code.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keyPropertiesFile.exists()) {
            upload {
                storeFile = rootProject.file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keyPropertiesFile.exists() ? signingConfigs.upload : signingConfigs.debug
            // Enable Proguard for better optimization
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Ensure Kotlin 2.1.0 Compatibility
        jvmTarget = "17"
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase BOM for automatic version management
    implementation platform('com.google.firebase:firebase-bom:33.7.0')

    // Firebase Dependencies
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Fix URL Launcher Dependency Issue
    implementation 'androidx.browser:browser:1.5.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    // Shrinks post videos before upload (MainActivity, connectapp/videoCompress).
    implementation "androidx.media3:media3-transformer:1.4.1"
    implementation "androidx.media3:media3-effect:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"

    // Required by flutter_local_notifications.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

apply plugin: 'com.google.gms.google-services'
