plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

android {
    namespace = "com.yakup.helperly"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.yakup.helperly"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // Enable Proguard for better optimization
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Ensure Kotlin 2.1.0 Compatibility
        jvmTarget = "17"
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase BOM for automatic version management
    implementation platform('com.google.firebase:firebase-bom:33.7.0')

    // Firebase Dependencies
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Fix URL Launcher Dependency Issue
    implementation 'androidx.browser:browser:1.5.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"

    // Required by flutter_local_notifications.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

apply plugin: 'com.google.gms.google-services'
