name: Call V2 Phase 3A Retry

on:
  push:
    branches: [call-v2]
    paths:
      - ".github/agent-loop/phase3a-retry.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: call-v2-phase3a-retry
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout call-v2
        uses: actions/checkout@v5
        with:
          ref: call-v2
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Phase 3A state
        id: state
        shell: bash
        run: |
          phase="$(node -p "require('./docs/agent-loop/STATE.json').phase")"
          status="$(node -p "require('./docs/agent-loop/STATE.json').status")"
          if [[ "$phase" != "3A" ]]; then
            echo "Expected Phase 3A, found $phase" >&2
            exit 1
          fi
          if [[ "$status" != "revision_required" && "$status" != "task_ready" ]]; then
            echo "Phase 3A is not ready to run: $status" >&2
            exit 1
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "base_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin authoritative task contract
        id: task_contract
        shell: bash
        run: |
          test -s docs/agent-loop/NEXT_TASK.md
          test -s docs/agent-loop/STATE.json
          task_sha="$(sha256sum docs/agent-loop/NEXT_TASK.md | awk '{print $1}')"
          state_phase="$(node -p "require('./docs/agent-loop/STATE.json').phase")"
          if ! grep -Fq "Phase ${state_phase}" docs/agent-loop/NEXT_TASK.md; then
            echo "NEXT_TASK.md does not identify STATE.json phase ${state_phase}. Refusing to run stale instructions." >&2
            exit 1
          fi
          echo "task_sha=$task_sha" >> "$GITHUB_OUTPUT"
          echo "Authoritative NEXT_TASK sha256: $task_sha"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: connect_functions/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          cd connect_functions
          npm ci
          npm install --global firebase-tools
          cd ..
          flutter pub get

      - name: Run Codex Phase 3A builder
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.4-mini
          effort: low
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: projectAKTS
          output-file: /tmp/phase3a-codex-final.md
          prompt: |
            Read AGENTS.md, docs/agent-loop/STATE.json, docs/agent-loop/NEXT_TASK.md, docs/agent-loop/HANDOFF.md, and every retained failure artifact referenced by those files.
            docs/agent-loop/NEXT_TASK.md is the sole authoritative implementation specification for this run. Do not substitute, narrow, expand, or resurrect an older task from workflow text, prior summaries, prior runs, or retained artifacts.
            Confirm before editing that NEXT_TASK.md describes the same phase as STATE.json and that STATE.json status permits implementation. If they disagree, make no implementation changes and fail with a precise explanation.
            Execute all required completion items, tests, documentation, allowed-file limits, validation commands, and handoff requirements in NEXT_TASK.md. Treat retained failure details only as diagnostic evidence, never as a replacement task specification.
            Preserve all repository safety rules in AGENTS.md. Keep legacy V1 untouched, keep V2 disabled by default, do not deploy, do not contact production services, do not change live configuration, IAM, OIDC, queues, secrets, native configuration, or production values.
            Do not modify workflows, AGENTS.md, or docs/agent-loop/**. Do not commit or push. Leave implementation changes uncommitted for the workflow to validate and record. Never print secrets.
            In the final summary, state the STATE phase and authoritative NEXT_TASK sha256 ${{ steps.task_contract.outputs.task_sha }}, list exact files changed, validations run, remaining risks, and confirm all safety constraints.


      - name: Remove Codex runtime metadata
        shell: bash
        run: rm -rf .agents .codex

      - name: Verify changed-file scope
        shell: bash
        run: |
          mapfile -t files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Codex produced no implementation changes." >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            case "$path" in
              lib/call_v2/*|test/call_v2/*|docs/call-v2/*|pubspec.yaml|pubspec.lock)
                ;;
              *)
                echo "Out-of-scope Phase 3A change: $path" >&2
                exit 1
                ;;
            esac
          done
          printf '%s\n' "${files[@]}"

      - name: Auto-format generated Dart
        shell: bash
        run: |
          dart format lib/call_v2 test/call_v2
          dart format --output=none --set-exit-if-changed lib/call_v2 test/call_v2

      - name: Re-pin Node 20 after Codex
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: connect_functions/package-lock.json

      - name: Run backend and Flutter validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cd connect_functions
            node --version
            npm run check:call-v2
            npm run validate:call-v2:deployment
            npm run test:call-v2:rules
            npm run test:call-v2:emulator
            npm run test:call-v2:emulator
            npm run test:call-v2:emulator
            node --check index.js
            cd ..
            dart format --output=none --set-exit-if-changed lib/call_v2 test/call_v2
            flutter analyze lib/call_v2 test/call_v2
            flutter test test/call_v2
            git diff --check
          } 2>&1 | tee /tmp/phase3a-validation.log

      - name: Upload validation failure log
        if: steps.validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phase3a-validation-${{ github.run_id }}
          path: /tmp/phase3a-validation.log
          retention-days: 7
          if-no-files-found: error

      - name: Record validation failure
        if: steps.validation.outcome == 'failure'
        shell: bash
        env:
          BASE_HEAD: ${{ steps.state.outputs.base_head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git reset --hard "$BASE_HEAD"
          git clean -fd
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          run_url = os.environ['RUN_URL']
          state_path = Path('docs/agent-loop/STATE.json')
          state = json.loads(state_path.read_text())
          state['status'] = 'revision_required'
          state['code_commit_sha'] = None
          state['ending_sha'] = 'SELF'
          state['changed_files'] = []
          state['validation']['check'] = 'failed'
          state['validation']['flutter_analysis'] = 'failed_or_not_reached'
          state['validation']['flutter_tests'] = 'failed_or_not_reached'
          state['review'] = {
              'decision': 'revision_required',
              'notes': f'Phase 3A validation failed. Download the phase3a-validation artifact from {run_url}'
          }
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          Path('docs/agent-loop/HANDOFF.md').write_text(
              '# Review Handoff\n\nPhase: 3A\nStatus: revision_required\n\n'
              f'Validation failed. Download the retained validation artifact from:\n\n{run_url}\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-loop/STATE.json docs/agent-loop/HANDOFF.md
          git commit -m "chore(agent-loop): record 3A retry validation failure"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:call-v2
          exit 1

      - name: Commit Phase 3A implementation
        if: steps.validation.outcome == 'success'
        id: commit_code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(call-v2): add Flutter V2 client groundwork"
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write Phase 3A handoff
        if: steps.validation.outcome == 'success'
        shell: bash
        env:
          CODE_SHA: ${{ steps.commit_code.outputs.code_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          code_sha = os.environ['CODE_SHA']
          run_url = os.environ['RUN_URL']
          files = [line for line in subprocess.check_output(
              ['git', 'show', '--pretty=', '--name-only', code_sha], text=True
          ).splitlines() if line]
          summary_path = Path('/tmp/phase3a-codex-final.md')
          summary = summary_path.read_text().strip() if summary_path.exists() else 'Phase 3A implementation completed.'

          handoff = [
              '# External Review Handoff', '',
              'Phase: 3A',
              'Status: ready_for_review',
              f'Implementation SHA: {code_sha}',
              'Pushed branch-tip SHA: SELF', '',
              '## Files changed', ''
          ]
          handoff += [f'- `{path}`' for path in files]
          handoff += [
              '', '## Codex summary', '', summary, '',
              '## Validation', '',
              '- Node 20 backend checks passed',
              '- Deployment readiness validation passed',
              '- Firestore rules tests passed',
              '- Full backend emulator suite passed three times',
              '- Flutter formatting passed',
              '- Focused Flutter analysis passed',
              '- Focused Flutter tests passed',
              '- `git diff --check` passed',
              f'- Workflow run: {run_url}', '',
              '## Safety', '',
              '- V1 files were not modified.',
              '- The V2 feature gate remains disabled by default.',
              '- No production service was contacted.',
              '- No live configuration was changed.',
              '- Nothing was deployed.', ''
          ]
          Path('docs/agent-loop/HANDOFF.md').write_text('\n'.join(handoff) + '\n')

          state_path = Path('docs/agent-loop/STATE.json')
          state = json.loads(state_path.read_text())
          state['status'] = 'ready_for_review'
          state['code_commit_sha'] = code_sha
          state['ending_sha'] = 'SELF'
          state['changed_files'] = files
          state['validation'].update({
              'node_version': '20',
              'check': 'passed',
              'deployment_readiness': 'passed',
              'rules_tests': 'passed',
              'emulator_runs': ['passed', 'passed', 'passed'],
              'index_syntax_check': 'passed',
              'flutter_analysis': 'passed',
              'flutter_tests': 'passed'
          })
          state['review'] = {'decision': None, 'notes': None}
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          PY
          git add docs/agent-loop/HANDOFF.md docs/agent-loop/STATE.json
          git commit -m "chore(agent-loop): record 3A review handoff"

      - name: Push completed Phase 3A
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:call-v2
