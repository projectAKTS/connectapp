name: Call V2 Guarded Agent Loop

on:
  push:
    branches: [call-v2]
    paths:
      - ".github/agent-loop/phase3a-retry.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: call-v2-guarded-agent-loop
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout call-v2
        uses: actions/checkout@v5
        with:
          ref: call-v2
          fetch-depth: 0
          persist-credentials: false

      - name: Verify transition and task contract
        id: state
        shell: bash
        run: |
          python3 .github/scripts/validate-call-v2-agent-loop.py
          phase="$(node -p "require('./docs/agent-loop/STATE.json').phase")"
          phase_slug="$(printf '%s' "$phase" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9_-')"
          task_sha="$(sha256sum docs/agent-loop/NEXT_TASK.md | awk '{print $1}')"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "phase_slug=$phase_slug" >> "$GITHUB_OUTPUT"
          echo "task_sha=$task_sha" >> "$GITHUB_OUTPUT"
          echo "base_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: connect_functions/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          cd connect_functions
          npm ci
          npm install --global firebase-tools
          cd ..
          flutter pub get

      - name: Baseline backend health preflight
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          run_checked() {
            local label="$1"
            shift
            echo "=== $label ==="
            set +e
            "$@"
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              printf '%s\n' "$label" > /tmp/call-v2-baseline-failed-stage
              return "$rc"
            fi
          }

          run_emulator_with_retry() {
            local label="$1"
            echo "=== $label attempt 1 ==="
            set +e
            npm run test:call-v2:emulator
            local first_rc=$?
            set -e
            if [[ $first_rc -eq 0 ]]; then
              return 0
            fi

            echo "Transient baseline emulator failure detected; retrying once."
            echo "=== $label attempt 2 ==="
            set +e
            npm run test:call-v2:emulator
            local second_rc=$?
            set -e
            if [[ $second_rc -ne 0 ]]; then
              printf '%s\n' "$label" > /tmp/call-v2-baseline-failed-stage
              return "$second_rc"
            fi
            printf '%s\n' "$label" >> /tmp/call-v2-baseline-retries
          }

          {
            cd connect_functions
            node --version
            run_checked backend-check npm run check:call-v2
            run_checked deployment-readiness npm run validate:call-v2:deployment
            run_checked firestore-rules npm run test:call-v2:rules
            run_emulator_with_retry baseline-emulator
            run_checked backend-syntax node --check index.js
          } 2>&1 | tee /tmp/call-v2-baseline.log

      - name: Upload baseline failure evidence
        if: steps.baseline.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: call-v2-${{ steps.state.outputs.phase_slug }}-baseline-${{ github.run_id }}
          path: |
            /tmp/call-v2-baseline.log
            /tmp/call-v2-baseline-failed-stage
          retention-days: 7
          if-no-files-found: error

      - name: Record baseline block
        if: steps.baseline.outcome == 'failure'
        shell: bash
        env:
          BASE_HEAD: ${{ steps.state.outputs.base_head }}
          PHASE: ${{ steps.state.outputs.phase }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_stage="$(cat /tmp/call-v2-baseline-failed-stage 2>/dev/null || echo unknown-baseline-stage)"
          git reset --hard "$BASE_HEAD"
          git clean -fd
          FAILED_STAGE="$failed_stage" python3 - <<'PY'
          import json, os
          from pathlib import Path

          phase = os.environ['PHASE']
          run_url = os.environ['RUN_URL']
          failed_stage = os.environ['FAILED_STAGE']
          state_path = Path('docs/agent-loop/STATE.json')
          state = json.loads(state_path.read_text())
          state['status'] = 'task_ready'
          state['code_commit_sha'] = None
          state['ending_sha'] = 'SELF'
          state['changed_files'] = []
          state.setdefault('validation', {})['baseline_preflight'] = 'failed'
          state['validation']['baseline_failed_stage'] = failed_stage
          state['review'] = {
              'decision': 'blocked_by_baseline',
              'notes': (
                  f'Phase {phase} implementation was not attempted because the unchanged '
                  f'backend baseline failed at {failed_stage}. Evidence: {run_url}'
              )
          }
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          Path('docs/agent-loop/HANDOFF.md').write_text(
              '# Baseline Block Handoff\n\n'
              f'Phase: {phase}\nStatus: task_ready\n\n'
              'Implementation was not attempted. The unchanged backend baseline failed before Codex ran.\n\n'
              f'Failed stage: `{failed_stage}`\n\nEvidence: {run_url}\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-loop/STATE.json docs/agent-loop/HANDOFF.md
          git commit -m "chore(agent-loop): record $PHASE baseline block"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:call-v2
          exit 1

      - name: Run Codex active-phase builder
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.4-mini
          effort: low
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-users: projectAKTS
          output-file: /tmp/call-v2-codex-final.md
          prompt: |
            Read AGENTS.md, docs/agent-loop/STATE.json, docs/agent-loop/NEXT_TASK.md, docs/agent-loop/HANDOFF.md, and retained validation artifacts referenced there.
            docs/agent-loop/NEXT_TASK.md is the sole authoritative implementation specification. Execute only STATE phase ${{ steps.state.outputs.phase }} at task fingerprint ${{ steps.state.outputs.task_sha }}.
            Do not substitute, narrow, expand, or resurrect an older task from workflow text, summaries, earlier phases, runs, or artifacts.
            Confirm NEXT_TASK.md identifies the same phase and STATE status permits implementation before editing. If not, make no implementation changes and fail precisely.
            Execute every completion item, allowed-file limit, validation, documentation, and handoff requirement in NEXT_TASK.md.
            Preserve AGENTS.md and all accepted behavior. Keep legacy V1 untouched and V2 disabled by default. Do not deploy, contact production services, enable live settings, alter IAM/OIDC/queues/secrets/native production configuration, or invent production values.
            Do not modify workflows, AGENTS.md, or docs/agent-loop/**. Do not commit or push. Leave implementation changes uncommitted. Never print secrets.
            In the final summary, state the phase and task fingerprint, exact files changed, validations run, remaining risks, and safety confirmations.

      - name: Remove Codex runtime metadata
        shell: bash
        run: rm -rf .agents .codex

      - name: Verify changed-file scope
        shell: bash
        run: |
          mapfile -t files < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Codex produced no implementation changes." >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            case "$path" in
              lib/call_v2/*|test/call_v2/*|docs/call-v2/*|pubspec.yaml|pubspec.lock)
                ;;
              *)
                echo "Out-of-scope Call V2 change: $path" >&2
                exit 1
                ;;
            esac
          done
          printf '%s\n' "${files[@]}"

      - name: Auto-format generated Dart
        shell: bash
        run: |
          dart format lib/call_v2 test/call_v2
          dart format --output=none --set-exit-if-changed lib/call_v2 test/call_v2

      - name: Re-pin Node 20 after Codex
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: connect_functions/package-lock.json

      - name: Run backend and Flutter validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          run_checked() {
            local label="$1"
            shift
            echo "=== $label ==="
            set +e
            "$@"
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              printf '%s\n' "$label" > /tmp/call-v2-validation-failed-stage
              return "$rc"
            fi
          }

          run_emulator_with_retry() {
            local label="$1"
            echo "=== $label attempt 1 ==="
            set +e
            npm run test:call-v2:emulator
            local first_rc=$?
            set -e
            if [[ $first_rc -eq 0 ]]; then
              return 0
            fi

            echo "Transient emulator failure detected; retrying this unchanged backend suite once."
            echo "=== $label attempt 2 ==="
            set +e
            npm run test:call-v2:emulator
            local second_rc=$?
            set -e
            if [[ $second_rc -ne 0 ]]; then
              printf '%s\n' "$label" > /tmp/call-v2-validation-failed-stage
              return "$second_rc"
            fi
            printf '%s\n' "$label" >> /tmp/call-v2-validation-retries
          }

          {
            cd connect_functions
            node --version
            run_checked backend-check npm run check:call-v2
            run_checked deployment-readiness npm run validate:call-v2:deployment
            run_checked firestore-rules npm run test:call-v2:rules
            run_emulator_with_retry emulator-run-1
            run_emulator_with_retry emulator-run-2
            run_emulator_with_retry emulator-run-3
            run_checked backend-syntax node --check index.js
            cd ..
            run_checked dart-format-check dart format --output=none --set-exit-if-changed lib/call_v2 test/call_v2
            run_checked flutter-analysis flutter analyze lib/call_v2 test/call_v2
            run_checked flutter-tests flutter test test/call_v2
            run_checked diff-check git diff --check
          } 2>&1 | tee /tmp/call-v2-validation.log

      - name: Upload validation failure evidence
        if: steps.validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: call-v2-${{ steps.state.outputs.phase_slug }}-validation-${{ github.run_id }}
          path: |
            /tmp/call-v2-validation.log
            /tmp/call-v2-validation-failed-stage
            /tmp/call-v2-validation-retries
          retention-days: 7
          if-no-files-found: warn

      - name: Record validation failure
        if: steps.validation.outcome == 'failure'
        shell: bash
        env:
          BASE_HEAD: ${{ steps.state.outputs.base_head }}
          PHASE: ${{ steps.state.outputs.phase }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_stage="$(cat /tmp/call-v2-validation-failed-stage 2>/dev/null || echo unknown-validation-stage)"
          git reset --hard "$BASE_HEAD"
          git clean -fd
          FAILED_STAGE="$failed_stage" python3 - <<'PY'
          import json, os
          from pathlib import Path

          phase = os.environ['PHASE']
          run_url = os.environ['RUN_URL']
          failed_stage = os.environ['FAILED_STAGE']
          state_path = Path('docs/agent-loop/STATE.json')
          state = json.loads(state_path.read_text())
          state['status'] = 'revision_required'
          state['code_commit_sha'] = None
          state['ending_sha'] = 'SELF'
          state['changed_files'] = []
          state.setdefault('validation', {})['check'] = 'failed'
          state['validation']['failed_stage'] = failed_stage
          state['validation']['flutter_analysis'] = (
              'failed' if failed_stage == 'flutter-analysis' else 'failed_or_not_reached'
          )
          state['validation']['flutter_tests'] = (
              'failed' if failed_stage == 'flutter-tests' else 'failed_or_not_reached'
          )
          state['review'] = {
              'decision': 'revision_required',
              'notes': f'Phase {phase} validation failed at {failed_stage}. Evidence: {run_url}'
          }
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          Path('docs/agent-loop/HANDOFF.md').write_text(
              '# Review Handoff\n\n'
              f'Phase: {phase}\nStatus: revision_required\n\n'
              f'Validation failed at `{failed_stage}`.\n\nEvidence: {run_url}\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-loop/STATE.json docs/agent-loop/HANDOFF.md
          git commit -m "chore(agent-loop): record $PHASE validation failure"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:call-v2
          exit 1

      - name: Commit active-phase implementation
        if: steps.validation.outcome == 'success'
        id: commit_code
        shell: bash
        env:
          PHASE: ${{ steps.state.outputs.phase }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(call-v2): implement phase $PHASE task"
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write active-phase handoff
        if: steps.validation.outcome == 'success'
        shell: bash
        env:
          PHASE: ${{ steps.state.outputs.phase }}
          CODE_SHA: ${{ steps.commit_code.outputs.code_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TASK_SHA: ${{ steps.state.outputs.task_sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          phase = os.environ['PHASE']
          code_sha = os.environ['CODE_SHA']
          run_url = os.environ['RUN_URL']
          task_sha = os.environ['TASK_SHA']
          files = [line for line in subprocess.check_output(
              ['git', 'show', '--pretty=', '--name-only', code_sha], text=True
          ).splitlines() if line]
          summary_path = Path('/tmp/call-v2-codex-final.md')
          summary = summary_path.read_text().strip() if summary_path.exists() else f'Phase {phase} implementation completed.'
          retries_path = Path('/tmp/call-v2-validation-retries')
          transient_retries = retries_path.read_text().splitlines() if retries_path.exists() else []

          handoff = [
              '# External Review Handoff', '',
              f'Phase: {phase}',
              'Status: ready_for_review',
              f'Implementation SHA: {code_sha}',
              f'Authoritative task SHA-256: {task_sha}',
              'Pushed branch-tip SHA: SELF', '',
              '## Files changed', ''
          ]
          handoff += [f'- `{path}`' for path in files]
          handoff += [
              '', '## Codex summary', '', summary, '',
              '## Validation', '',
              '- Baseline backend preflight passed before implementation',
              '- Node 20 backend checks passed',
              '- Deployment readiness validation passed',
              '- Firestore rules tests passed',
              '- Full backend emulator suite passed three times',
              f'- Bounded transient emulator retries: {len(transient_retries)}',
              '- Flutter formatting passed',
              '- Focused Flutter analysis passed',
              '- Focused Flutter tests passed',
              '- `git diff --check` passed',
              f'- Workflow run: {run_url}', '',
              '## Safety', '',
              '- V1 files were not modified.',
              '- V2 remains disabled by default.',
              '- No production service was contacted.',
              '- No live configuration was changed.',
              '- Nothing was deployed.', ''
          ]
          Path('docs/agent-loop/HANDOFF.md').write_text('\n'.join(handoff) + '\n')

          state_path = Path('docs/agent-loop/STATE.json')
          state = json.loads(state_path.read_text())
          state['status'] = 'ready_for_review'
          state['code_commit_sha'] = code_sha
          state['ending_sha'] = 'SELF'
          state['changed_files'] = files
          state.setdefault('validation', {}).update({
              'baseline_preflight': 'passed',
              'node_version': '20',
              'check': 'passed',
              'deployment_readiness': 'passed',
              'rules_tests': 'passed',
              'emulator_runs': ['passed', 'passed', 'passed'],
              'emulator_transient_retries': len(transient_retries),
              'index_syntax_check': 'passed',
              'flutter_analysis': 'passed',
              'flutter_tests': 'passed'
          })
          state['review'] = {'decision': None, 'notes': None}
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          PY
          git add docs/agent-loop/HANDOFF.md docs/agent-loop/STATE.json
          git commit -m "chore(agent-loop): record $PHASE review handoff"

      - name: Push completed active phase
        if: steps.validation.outcome == 'success'
        shell: bash
        run: |
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:call-v2
